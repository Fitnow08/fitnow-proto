version: "3"

vars:
  GO_VERSION: "1.25"
  GOLANGCI_LINT_VERSION: "v2.4.0"
  GCI_VERSION: "v0.13.6"
  GOFUMPT_VERSION: "v0.8.0"
  BUF_VERSION: "1.53.0"
  PROTOC_GEN_GO_VERSION: "v1.36.6"
  PROTOC_GEN_GO_GRPC_VERSION: "v1.5.1"

  BIN_DIR: "{{.ROOT_DIR}}/bin"
  GOLANGCI_LINT: "{{.BIN_DIR}}/golangci-lint"
  GCI: "{{.BIN_DIR}}/gci"
  GOFUMPT: "{{.BIN_DIR}}/gofumpt"
  BUF: "{{.BIN_DIR}}/buf"
  PROTOC_GEN_GO: "{{.BIN_DIR}}/protoc-gen-go"
  PROTOC_GEN_GO_GRPC: "{{.BIN_DIR}}/protoc-gen-go-grpc"

tasks:
  install-formatters:
    desc: "Intall formatters gci and gofumpt to ./bin"
    cmds:
      - GOBIN={{.BIN_DIR}} go install github.com/daixiang0/gci@{{.GCI_VERSION}}
      - GOBIN={{.BIN_DIR}} go install mvdan.cc/gofumpt@{{.GOFUMPT_VERSION}}

  format:
    desc: "Fromat all project gofumpt + gci"
    deps: [install-formatters]
    cmds:
      - |
        echo "Format for gofumpt ..."
        {{.GOFUMPT}} -extra -w ./pkg/gen/go/...
  install-golangci-lint:
    cmds:
      - GOBIN={{.BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
  lint:
    desc: "lint all files for golangci-lint"
    cmds:
      - "{{.GOLANGCI_LINT}} run ./pkg/gen/go/... -config=.golangci.yaml"
  dependencies:
    cmds:
      - go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      - go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      - go install github.com/meshapi/grpc-api-gateway/codegen/cmd/protoc-gen-openapiv3@latestt
      - go install github.com/meshapi/grpc-api-gateway/codegen/cmd/protoc-gen-grpc-api-gateway@latest
  generate:
    aliases:
      - go
    desc: "Generate code from proto files"
    cmds:
      - protoc -I proto proto/**/*.proto --go_out=./gen/go/ --go_opt=paths=source_relative --go-grpc_out=./gen/go/ --go-grpc_opt=paths=source_relative
  buf:
    aliases:
      - rust
    desc: "Generate Rust code from proto files using prost"
    cmds:
      - go tool buf generate --template buf.gen.yaml
  dep:
    cmd: go tool buf dep update

