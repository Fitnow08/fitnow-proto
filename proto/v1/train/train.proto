syntax = "proto3";

package trainv1;

import "google/protobuf/timestamp.proto";

service TrainService {
  rpc GetAllTrains(GetAllTrainsRequest) returns (GetAllTrainsResponse) {}
  rpc GetTrainById(GetTrainByIdRequest) returns (GetTrainByIdResponse){}
  rpc CreateTrain(CreateTrainRequest) returns(CreateTrainResponse) {}
  rpc UpdateTrain(UpdateTrainRequest) returns(UpdateTrainResponse) {}
  rpc DeleteTrain(DeleteTrainRequest) returns(DeleteTrainResponse) {}
  rpc AddTrainImage(AddTrainImageRequest) returns (AddTrainImageResponse){}
}
message AddTrainImageResponse{}
message AddTrainImageRequest{
  string train_id = 1;
  string extension = 2;
  string content_type = 3;
  bytes image = 4;
}
message DeleteTrainResponse {}
message DeleteTrainRequest{
  string id = 1;
  string user_id = 2;
}
message UpdateTrainResponse{}

message UpdateTrainRequest {
  string train_id = 1;

  string title = 2;
  optional TrainType type = 3;
  optional int64 duration = 4;
  bool is_public = 5;
  optional Difficulty difficulty = 6;
  optional int64 calories = 7;
  string user_id = 8;
}

message CreateTrainResponse {
  Train train = 1;
}
message CreateTrainRequest {
  string title = 1;
  TrainType type = 2;
  int64 duration = 3;
  bool is_public = 4;
  Difficulty difficulty = 5;
  int64 calories = 6;
  string category_id = 7;
  string user_id = 8;
}
message GetTrainByIdResponse{
  Train train = 1;
}
message GetTrainByIdRequest{
  string id = 1;
}

message GetAllTrainsResponse {
  repeated Train trains = 1;
}
message GetAllTrainsRequest {
  uint64 page = 1;
  uint64 limit = 2;
  string category_id = 3;
  string text = 4;
}

message Train {
  string id = 1;
  string title = 2;
  string type = 3;
  int64 duration = 4;
  bool is_public = 5;
  string difficulty = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  string category_id = 9;
  int64 calories = 10;
  string image_path = 11;
  google.protobuf.Timestamp updated_at = 12;
  int64 version = 13;
}

enum TrainType {
  TRAIN_TYPE_UNSPECIFIED = 0;
  TRAIN_TYPE_STRENGTH = 1;
  TRAIN_TYPE_CARDIO = 2;
  TRAIN_TYPE_STRETCHING = 3;
}

enum Difficulty {
  DIFFICULTY_UNSPECIFIED = 0;
  DIFFICULTY_EASY = 1;
  DIFFICULTY_MEDIUM = 2;
  DIFFICULTY_HARD = 3;
}
